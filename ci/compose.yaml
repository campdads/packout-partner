# The stack the plugin's checks run in: a database and one WordPress site,
# both in memory. Nothing is kept, no volume is made, and no port is
# published. ci/run.sh starts it, with passwords it makes for the run.

name: packout-partner-ci

services:
  db:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: ${CI_DB_PASSWORD:?start the stack with ci/run.sh}
      MYSQL_ROOT_PASSWORD: ${CI_DB_ROOT_PASSWORD:?start the stack with ci/run.sh}
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--protocol=tcp", "--host=127.0.0.1", "--silent"]
      interval: 3s
      timeout: 5s
      retries: 40

  wordpress:
    build:
      context: .
      args:
        WORDPRESS_IMAGE: ${CI_WORDPRESS_IMAGE:?start the stack with ci/run.sh}
        CLI_IMAGE: ${CI_CLI_IMAGE:?start the stack with ci/run.sh}
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${CI_DB_PASSWORD:?start the stack with ci/run.sh}
      WORDPRESS_DEBUG: "1"
      # A warning goes to wp-content/debug.log, where ci/run.sh reads it, and not into a page or a JSON answer.
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
      # The update test signs a package with a key of its own. Only a local
      # site may add a key to the ones it trusts.
      WP_ENVIRONMENT_TYPE: local
      WP_CLI_CACHE_DIR: /tmp/wp-cli
    tmpfs:
      - /var/www/html
    volumes:
      # The plugin as a site would have it: this checkout, or an unpacked
      # package when CI_PLUGIN_DIR names one. The tests are not part of a
      # package, so they are mounted on their own.
      - ${CI_PLUGIN_DIR:-..}:/var/www/html/wp-content/plugins/packout-partner:ro
      - ../tests:/var/www/html/wp-content/packout-partner-tests:ro
